<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#04141a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Cell Drift</title>
<link rel="manifest" href="./manifest.json">
<link rel="stylesheet" href="./style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <!-- HUD: обычный DOM поверх canvas, ни одной картинки -->
  <div id="hud">
    <div class="topbar">
      <div class="stack">
        <div class="bar hp"><i id="hpFill"></i></div>
        <div class="bar stam"><i id="stamFill"></i></div>
      </div>
      <div class="chip dna"><span class="dot"></span><span id="dnaVal">0</span></div>
      <div class="chip lvl"><span data-i18n="level">ур.</span> <span id="levelVal">1</span></div>
      <div class="spacer"></div>
      <button id="btnPause" class="chip icon-btn" aria-label="pause"><i class="ic-pause"></i></button>
    </div>

    <div class="midrow">
      <canvas id="minimap" width="112" height="112"></canvas>
      <button id="btnSkill" class="skill" aria-label="skill"><span id="skillRing"></span><i class="ic-bolt"></i></button>
    </div>

    <div class="bottom">
      <div id="fps" class="chip mono">— FPS</div>
      <div class="growthWrap"><div class="bar growth"><i id="growthFill"></i></div></div>
    </div>
  </div>

  <!-- Экраны -->
  <div id="screens">
    <section id="menu" class="screen show">
      <canvas id="logo"></canvas>
      <h1 data-i18n="title">КЛЕТКА</h1>
      <p class="sub" data-i18n="subtitle">выживи, вырасти, эволюционируй</p>
      <div class="menuBtns">
        <button id="btnContinue" class="big" data-i18n="continue">Продолжить</button>
        <button id="btnNew" class="big primary" data-i18n="newGame">Новая жизнь</button>
      </div>
      <div class="row">
        <button id="btnLang" class="chip">RU</button>
        <button id="btnCtrl" class="chip"><span data-i18n="control">Управление</span>: <span id="ctrlVal" data-i18n="ctrlFollow">палец</span></button>
        <button id="btnSound" class="chip">♪</button>
      </div>
    </section>

    <section id="editorUI" class="screen">
      <div class="edTop">
        <div class="chip dna"><span class="dot"></span><span id="edDna">0</span></div>
        <div class="spacer"></div>
        <button id="edUndo" class="chip" data-i18n="undo">откат</button>
        <button id="edRandom" class="chip" data-i18n="random">случайное</button>
        <button id="edSym" class="chip on" data-i18n="symmetry">симметрия</button>
        <button id="edPreview" class="chip" data-i18n="preview">превью</button>
        <button id="edDone" class="chip btn" data-i18n="done">в океан</button>
      </div>
    </section>

    <section id="levelup" class="screen">
      <h2 data-i18n="levelUp">Новый уровень роста</h2>
      <p class="sub"><span data-i18n="level">ур.</span> <span id="luLevel">2</span></p>
      <button id="btnEditor" class="big primary" data-i18n="evolve">Эволюция</button>
    </section>

    <section id="pause" class="screen">
      <h2 data-i18n="pause">Пауза</h2>
      <div class="menuBtns">
        <button id="btnResume" class="big primary" data-i18n="resume">Дальше</button>
        <button id="btnToMenu" class="big" data-i18n="menu">В меню</button>
      </div>
    </section>

    <section id="death" class="screen">
      <h2 data-i18n="died">Тебя съели</h2>
      <p class="sub" id="deathStats"></p>
      <div class="menuBtns">
        <button id="btnRespawn" class="big primary" data-i18n="resume">Дальше</button>
        <button id="btnDeathMenu" class="big" data-i18n="menu">В меню</button>
      </div>
    </section>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
